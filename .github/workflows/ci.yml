name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Ato "primeiro passa": o estado final do repo (código correto + 3 testes)
  # roda verde, com cobertura 100% e mutação 100%.
  validacao:
    name: Validação (estado final — tudo verde)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura (Jest)
        run: npm test

      - name: Rodar mutation testing (Stryker)
        run: npm run test:mutation

      - name: Gerar relatório resumo
        if: always()
        run: npm run report:summary

      - name: Publicar relatório de cobertura (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar relatório de mutation testing (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
          if-no-files-found: ignore

  # Evidência narrada: os 4 atos do "vazamento silencioso", cada um executado
  # com Jest/Stryker reais e registrado no Job Summary + artefato + Pages.
  evidencia:
    name: Evidência (os 4 atos do vazamento silencioso)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Reproduzir os 4 atos e gerar evidência
        run: node scripts/evidence.js

      - name: Publicar evidência (logs de cada ato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: reports/evidence
          retention-days: 30
          if-no-files-found: ignore

      - name: Empacotar site de evidência para o GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/pages

  deploy-pages:
    name: Publicar evidência no GitHub Pages
    needs: evidencia
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
