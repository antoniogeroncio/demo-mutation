name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes + Cobertura + Mutação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura (Jest)
        run: npm test

      - name: Rodar mutation testing (Stryker)
        run: npm run test:mutation

      - name: Gerar relatório resumo
        if: always()
        run: npm run report:summary

      - name: Publicar relatório de cobertura (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar relatório de mutation testing (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
          if-no-files-found: ignore

      - name: Montar site do Pages (landing + relatório)
        if: always()
        run: |
          mkdir -p public/relatorio
          cp site/index.html public/index.html
          if [ -d reports/mutation ]; then cp -r reports/mutation/. public/relatorio/; fi

      - name: Empacotar site para o GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Publicar site no GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
